<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">

    <link rel="icon" href="Resources/Hogwarts Logo.png" type="image/png">
    <link rel="stylesheet" href="CSS/style.css">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <title>Hogwarts Student Checker</title>
</head>

<body>

    <!-- Transparent Minimalist Hogwarts Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <img src="Resources/Hogwarts Logo.png" alt="Hogwarts Crest">
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">Student Checker</a>
            <a href="HTML Pages/page2.html">Student Adder</a>
            <a href="HTML Pages/page3.html">Snape's Nonmetals</a>
            <a href="HTML Pages/page4.html">Meet the Creator</a>
        </div>
    </nav>

    <!-- Centers everything on the page -->
    <div class="container">

        <!-- Stacks the form card and the result box vertically -->
        <div class="card-wrapper">

            <form>
                <!-- Logo, title, and welcome message -->
                <div class="header">
                    <img src="Resources/Hogwarts Logo.png" alt="Hogwarts Logo">
                    <h1>Hogwarts Student Checker</h1>
                    <p>Welcome to Hogwarts! Present your credentials to prove you belong among the witches and wizards.</p>
                </div>

                <!-- Name fields (main.py reads these by their ids) -->
                <div class="inputs">
                    <label for="firstname">First Name</label><br>
                    <input type="text" id="firstname" placeholder="Harry"><br>

                    <label for="lastname">Last Name</label><br>
                    <input type="text" id="lastname" placeholder="Potter"><br>
                </div>

                <!-- Submit button. py-click runs the verify() function in main.py file -->
                <div class="footer">
                    <button type="button" id="loginBTN" py-click="verify">Enter</button>
                </div>
            </form>

            <!-- Where the verification result shows up (updated by main.py) -->
            <div id="result-box" class="result-box">
                Please enter your first and last name to verify enrollment.
            </div>

        </div>
    </div>

    <!-- Page footer w/ my details -->
    <footer>
        <p>David | 2Q Project, 10-Sapphire © 2026</p>
    </footer>

    <script type="py" src="main.py"></script>

</body>

</html>
